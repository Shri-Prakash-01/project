services:
  - type: web
    name: securevault
    runtime: docker
    repo: https://github.com/Shri-Prakash-01/project
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: RENDER
        value: true
    disk:
      name: uploads
      mountPath: /tmp/uploads
      sizeGB: 1
